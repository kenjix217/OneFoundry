services:
  db:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: onefoundry
      POSTGRES_USER: onefoundry
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in onefoundry/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onefoundry -d onefoundry"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [input_processing]
  migrate:
    build:
      context: .
      target: runtime
    environment: &bootstrap_env
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: onefoundry
      DB_USER: onefoundry
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in onefoundry/.env}
      APP_DB_USER: ${APP_DB_USER:-onefoundry_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in onefoundry/.env}
      APP_ALLOWED_HOSTS: localhost,127.0.0.1
      APP_PUBLIC_PORT: ${APP_PORT:-8765}
      EXTENSION_ALLOWED_ORIGINS: '${EXTENSION_ALLOWED_ORIGINS:-[]}'
      EXTENSION_TIMEOUT_SECONDS: '${EXTENSION_TIMEOUT_SECONDS:-10}'
      EXTENSION_MAX_INPUT_BYTES: '${EXTENSION_MAX_INPUT_BYTES:-65536}'
      EXTENSION_MAX_RESPONSE_BYTES: '${EXTENSION_MAX_RESPONSE_BYTES:-262144}'
      EXTENSION_WORKER_IMAGE: '${EXTENSION_WORKER_IMAGE:-}'
      EXTENSION_WORKER_MEMORY_MB: '${EXTENSION_WORKER_MEMORY_MB:-256}'
      EXTENSION_WORKER_PROCESSES: '${EXTENSION_WORKER_PROCESSES:-32}'
