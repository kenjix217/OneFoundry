    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 256m
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    restart: on-failure
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: onefoundry
      DB_USER: ${APP_DB_USER:-onefoundry_app}
      DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in onefoundry/.env}
      ONEFOUNDRY_BUSINESS_MODE: ${ONEFOUNDRY_BUSINESS_MODE:-off}
      ONEFOUNDRY_MAX_LINKED_ORDERS: ${ONEFOUNDRY_MAX_LINKED_ORDERS:-2}
      ONEFOUNDRY_MAX_MODEL_ATTEMPTS: ${ONEFOUNDRY_MAX_MODEL_ATTEMPTS:-2}
      ONEFOUNDRY_MAX_PUBLIC_WEB_CALLS: ${ONEFOUNDRY_MAX_PUBLIC_WEB_CALLS:-0}
      ONEFOUNDRY_MAX_CONTEXT_BYTES: ${ONEFOUNDRY_MAX_CONTEXT_BYTES:-unlimited}
      ONEFOUNDRY_MAX_OUTPUT_TOKENS: ${ONEFOUNDRY_MAX_OUTPUT_TOKENS:-512}
      ONEFOUNDRY_MAX_ELAPSED_SECONDS: ${ONEFOUNDRY_MAX_ELAPSED_SECONDS:-600}
      ONEFOUNDRY_COORDINATOR_POLL_SECONDS: ${ONEFOUNDRY_COORDINATOR_POLL_SECONDS:-5}
      ONEFOUNDRY_COORDINATOR_LEASE_SECONDS: ${ONEFOUNDRY_COORDINATOR_LEASE_SECONDS:-60}
      ONEFOUNDRY_COORDINATOR_MAX_ATTEMPTS: ${ONEFOUNDRY_COORDINATOR_MAX_ATTEMPTS:-3}
      ONEFOUNDRY_COORDINATOR_ACTOR_ID: ${ONEFOUNDRY_COORDINATOR_ACTOR_ID:-onefoundry-coordinator}
      COORDINATION_MODE: ${COORDINATION_MODE:-off}
      COORDINATION_MAX_CHAIN_DEPTH: ${COORDINATION_MAX_CHAIN_DEPTH:-10}
      COORDINATION_MAX_ORDERS_PER_DAY: ${COORDINATION_MAX_ORDERS_PER_DAY:-50}
      COORDINATION_TIMEZONE: ${COORDINATION_TIMEZONE:-UTC}
      COORDINATION_MAX_AUTO_STARTS_PER_DAY: ${COORDINATION_MAX_AUTO_STARTS_PER_DAY:-20}
      LIVE_TEXT_MAX_PROMPT_BYTES: ${LIVE_TEXT_MAX_PROMPT_BYTES:-32000}
      AGENT_AUTOMATION_CONTEXT_MAX_ITEMS: ${AGENT_AUTOMATION_CONTEXT_MAX_ITEMS:-8}
      AGENT_AUTOMATION_GOAL_MAX_CHARS: ${AGENT_AUTOMATION_GOAL_MAX_CHARS:-500}
      LIVE_TEXT_MAX_OUTPUT_TOKENS: ${LIVE_TEXT_MAX_OUTPUT_TOKENS:-512}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [input_processing]
  video-edit-asset-init:
    image: postgres:16.10-alpine
    network_mode: none
    environment:
      VIDEO_EDIT_ASSET_ROOT: ${VIDEO_EDIT_ASSET_ROOT-/video-edit-assets}
    volumes:
      - video_edit_assets:${VIDEO_EDIT_ASSET_ROOT-/video-edit-assets}
    command: ["sh", "-c", "chown 10001:10001 \"$$VIDEO_EDIT_ASSET_ROOT\" && chmod 0700 \"$$VIDEO_EDIT_ASSET_ROOT\""]
  input-file-init:
    image: postgres:16.10-alpine
    network_mode: none
    environment:
      INPUT_FILE_ROOT: ${INPUT_FILE_ROOT:-/input-files}
    volumes:
      - input_files:${INPUT_FILE_ROOT:-/input-files}
    command: ["sh", "-c", "chown 10001:10001 \"$$INPUT_FILE_ROOT\" && chmod 0700 \"$$INPUT_FILE_ROOT\""]
  input-file-worker:
    build:
      context: .
      target: input-worker
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 512m
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: onefoundry
      DB_USER: ${APP_DB_USER:-onefoundry_app}
      DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in onefoundry/.env}
      INPUT_FILE_ROOT: ${INPUT_FILE_ROOT:-/input-files}
      INPUT_FILE_MAX_BYTES: ${INPUT_FILE_MAX_BYTES:-26214400}
      INPUT_FILE_MAX_TEXT_BYTES: ${INPUT_FILE_MAX_TEXT_BYTES:-262144}
    volumes:
      - input_files:${INPUT_FILE_ROOT:-/input-files}
    depends_on:
      migrate:
        condition: service_completed_successfully
      input-file-init:
        condition: service_completed_successfully
    networks: [input_processing]
  model-secret-init:
    image: postgres:16.10-alpine
    network_mode: none
    volumes:
      - model_secrets:/model-secrets
    command: ["sh", "-c", "chown 10001:10001 /model-secrets && chmod 0700 /model-secrets"]
  artifact-workspace-init:
    image: postgres:16.10-alpine
    network_mode: none
    environment:
      ARTIFACT_WORKSPACE_ROOT: ${ARTIFACT_WORKSPACE_ROOT:-/artifact-workspace}
    volumes:
      - artifact_workspace:${ARTIFACT_WORKSPACE_ROOT:-/artifact-workspace}
    command: ["sh", "-c", "chown 10001:10001 \"$$ARTIFACT_WORKSPACE_ROOT\" && chmod 0700 \"$$ARTIFACT_WORKSPACE_ROOT\""]
  mailpit:
    image: axllent/mailpit:v1.27.9
    command: ["--smtp", "0.0.0.0:1025", "--listen", "0.0.0.0:8025", "--max", "100"]
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
  ollama:
    profiles: [local-model]
    image: ollama/ollama:0.34.3
    volumes:
      - ollama_models:/root/.ollama
  test:
    profiles: [test]
    build:
      context: .
      target: test
    user: "10001:10001"
    environment: *bootstrap_env
    volumes:
      - model_secrets:/model-secrets
      - artifact_workspace:${ARTIFACT_WORKSPACE_ROOT:-/artifact-workspace}
    command:
      - sh
      - -c
      - alembic upgrade head && python -m onefoundry.db_roles && pytest -q tests/test_capability_setup_host_postgres.py tests/test_self_extension_postgres.py tests/test_self_extension_failure_postgres.py tests/test_repository_code_abandon_postgres.py tests/test_extension_target_resume_postgres.py tests/test_extension_replacement_postgres.py tests/test_extension_completion_postgres.py tests/test_capability_setup_postgres.py tests/test_repository_github_postgres.py tests/test_direct_agent_conversation_postgres.py tests/test_chief_conversation_trash_postgres.py tests/test_chief_workspace_postgres.py tests/test_chief_visibility_postgres.py tests/test_project_chief_inbox_postgres.py tests/test_work_order_acceptance_postgres.py tests/test_events.py tests/test_api_postgres.py tests/test_profile_hierarchy_migration_postgres.py tests/test_conversation_origin_migration_postgres.py tests/test_project_plan_migration_postgres.py tests/test_project_lifecycle_postgres.py tests/test_model_gateway_postgres.py tests/test_codex_account_postgres.py tests/test_grok_account_postgres.py tests/test_project_sources_postgres.py tests/test_github_tool_postgres.py tests/test_github_stage_proposal_postgres.py tests/test_github_stage_dispatch_postgres.py tests/test_github_fixture_fetch_v2_postgres.py tests/test_github_fixture_snapshot_v3_postgres.py tests/test_github_snapshot_codex_postgres.py tests/test_workflow_postgres.py tests/test_memory_postgres.py tests/test_memory_embeddings_postgres.py tests/test_company_memory_postgres.py tests/test_memory_capture_postgres.py tests/test_memory_plugin_db_role_postgres.py tests/test_memory_upgrade_postgres.py tests/test_text_role_postgres.py tests/test_live_text_postgres.py tests/test_onefoundry_capability_postgres.py tests/test_onefoundry_organizations_postgres.py tests/test_onefoundry_organization_api_postgres.py tests/test_onefoundry_context_postgres.py tests/test_onefoundry_budget_postgres.py tests/test_onefoundry_draft_postgres.py tests/test_onefoundry_intent_postgres.py tests/test_onefoundry_inbox_postgres.py tests/test_role_tool_admission_postgres.py tests/test_role_context_reads_postgres.py tests/test_role_coding_evidence_postgres.py tests/test_role_github_pr_postgres.py tests/test_role_web_admission_postgres.py tests/test_role_artifact_write_postgres.py tests/test_role_draft_work_order_postgres.py tests/test_role_qa_review_request_postgres.py tests/test_github_pr_comment_proposal_postgres.py tests/test_github_pr_comment_dispatch_postgres.py tests/test_github_pr_comment_api_postgres.py tests/test_role_github_pr_comment_postgres.py tests/test_browser_static_fixtures_postgres.py tests/test_browser_static_jobs_postgres.py tests/test_browser_static_api_postgres.py tests/test_role_browser_static_inspect_postgres.py tests/test_task_conversation_postgres.py tests/test_task_session_postgres.py tests/test_team_workflow_postgres.py tests/test_task_session_start_postgres.py tests/test_dependency_availability_postgres.py tests/test_team_repository_read_postgres.py tests/test_child_rework_postgres.py tests/test_media_capture_postgres.py tests/test_video_edit_postgres.py -m "not integration" tests/test_input_files_postgres.py tests/test_remote_channels_postgres.py tests/test_skill_library_postgres.py tests/test_coordination_postgres.py tests/test_coordination_triage_postgres.py tests/test_mail_postgres.py tests/test_mail_plugin_postgres.py tests/test_coordination_autostart_postgres.py tests/test_coordination_profiles_postgres.py tests/test_connectors_postgres.py tests/test_synthetic_code_postgres.py tests/test_external_code_postgres.py tests/test_sales_postgres.py tests/test_synthetic_memory_postgres.py tests/test_documents_postgres.py tests/test_document_writes_postgres.py tests/test_document_actions_postgres.py tests/test_smtp_postgres.py tests/test_zoho_mail_postgres.py tests/test_zoho_oauth_postgres.py tests/test_gateway_extension_lifecycle_postgres.py tests/test_gateway_extension_identity_postgres.py tests/test_gateway_extension_remote_postgres.py tests/test_gateway_extension_worker_postgres.py tests/test_extension_webhooks_postgres.py tests/test_gateway_extension_writes_postgres.py tests/test_gateway_extension_binding_aba_postgres.py tests/test_gateway_extension_portability_postgres.py
    depends_on:
      db:
        condition: service_healthy
      model-secret-init:
        condition: service_completed_successfully
      artifact-workspace-init:
        condition: service_completed_successfully
    networks: [input_processing]
  spool-init:
    build:
      context: .
      target: runner
    network_mode: none
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - runner_spool:/runner-spool
    command:
      - python
      - -c
      - >-
        from pathlib import Path;
        root = Path('/runner-spool');
        [ (root / name).mkdir(exist_ok=True) for name in
        ('jobs', 'claims', 'receipts', 'artifacts', 'repos',
        'external', 'external/jobs', 'external/claims',
        'external/receipts', 'external/artifacts') ];
        (root / 'browser-static').mkdir(mode=0o700, exist_ok=True)
  runner:
    build:
      context: .
      target: runner
    network_mode: none
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - runner_spool:/runner-spool
    depends_on:
      spool-init:
        condition: service_completed_successfully
  external-runner:
    build:
      context: .
      target: runner
    network_mode: none
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - runner_spool:/runner-spool
    command: ["python", "-m", "runner.external_service"]
    depends_on:
      spool-init:
        condition: service_completed_successfully
  github-stage-spool-init:
    profiles: [offline-github-stage]
    build:
      context: .
      target: runner
    network_mode: none
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - runner_spool:/runner-spool
    command:
      - python
      - -c
      - >-
        from pathlib import Path;
        root = Path('/runner-spool/github-stage');
        [ (root / name).mkdir(parents=True, exist_ok=True) for name in
        ('jobs', 'claims', 'receipts', 'artifacts') ]
    depends_on:
      spool-init:
        condition: service_completed_successfully
  github-stage-offline:
    profiles: [offline-github-stage]
    build:
      context: .
      target: github-stage-runner
    network_mode: none
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 32
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    volumes:
      - runner_spool:/runner-spool
      - ./.offline-github-stage/remote.git:/fixture/remote.git:ro
    command:
      - python
      - -m
      - runner.github_stage_supervisor
      - --spool
      - /runner-spool/github-stage
      - --fixture-remote
      - /fixture/remote.git
      - --fixture-owner
      - ${GITHUB_STAGE_FIXTURE_OWNER:-sample}
      - --fixture-repo
      - ${GITHUB_STAGE_FIXTURE_REPO:-project}
      - --max-files
      - ${GITHUB_STAGE_MAX_FILES:-1000}
      - --max-bytes
      - ${GITHUB_STAGE_MAX_BYTES:-8388608}
      - --max-tree-bytes
      - ${GITHUB_STAGE_MAX_TREE_BYTES:-1048576}
      - --wall-seconds
      - ${GITHUB_STAGE_WALL_SECONDS:-30}
      - --max-git-bytes
      - ${GITHUB_STAGE_MAX_GIT_BYTES:-16777216}
    depends_on:
      github-stage-spool-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  runner_spool:
  ollama_models:
  model_secrets:
  artifact_workspace:
  input_files:
  video_edit_assets:

networks:
  input_processing:
    internal: true
