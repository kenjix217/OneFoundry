      MEMORY_EMBEDDING_RUNTIME_PATH: ${MEMORY_EMBEDDING_RUNTIME_PATH:-}
      MEMORY_EMBEDDING_RUNTIME_SHA256: ${MEMORY_EMBEDDING_RUNTIME_SHA256:-}
